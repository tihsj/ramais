<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Ramais</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- TELA DE LOGIN -->
    <div id="telaLogin" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">Acesso ao Sistema de Ramais</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Perfil de Usuário</label>
                    <select id="loginUsuario" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="viewer">Visualizador (Apenas consulta)</option>
                        <option value="admin">Administrador (Edição total)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="loginSenha" placeholder="Digite a palavra-passe" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500" onkeypress="if(event.key === 'Enter') fazerLogin()">
                </div>

                <p id="erroLogin" class="text-red-500 text-sm hidden">Palavra-passe incorreta. Tente novamente.</p>

                <button onclick="fazerLogin()" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg hover:bg-blue-700 transition">
                    Entrar
                </button>
            </div>
        </div>
    </div>

    <!-- SISTEMA PRINCIPAL -->
    <div id="sistemaPrincipal" class="hidden p-4 md:p-8 max-w-6xl mx-auto">
        <!-- Cabeçalho -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between bg-white p-6 rounded-xl shadow-sm mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Lista de Ramais Telefónicos</h1>
                <p class="text-gray-500 text-sm mt-1">Consulte ou gerencie os ramais da instituição</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="labelPerfil" class="bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-bold"></span>
                <button onclick="fazerLogout()" class="px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg transition font-medium border border-red-200">
                    Sair
                </button>
            </div>
        </div>

        <!-- Controles (Busca e Botão Adicionar) -->
        <div class="flex flex-col sm:flex-row justify-between gap-4 mb-6">
            <div class="relative flex-1">
                <input type="text" id="searchInput" onkeyup="filtrarRamais()" placeholder="Pesquisar por ramal, setor ou e-mail..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            <button id="btnNovoRamal" onclick="abrirModalAdicionar()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Novo Ramal
            </button>
        </div>

        <!-- Tabela -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 text-xs uppercase tracking-wider">
                            <th class="py-3 px-6">Ramal</th>
                            <th class="py-3 px-6">Setor</th>
                            <th class="py-3 px-6">E-mail</th>
                            <th id="colunaAcoesHeader" class="py-3 px-6 text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaRamais" class="divide-y divide-gray-200 text-sm">
                        <tr>
                            <td colspan="4" class="text-center py-6 text-gray-500">A carregar ramais...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL (Adicionar / Editar) -->
    <div id="modalRamal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
            <h3 id="modalTitulo" class="text-xl font-bold text-gray-800 mb-4">Adicionar Novo Ramal</h3>
            <input type="hidden" id="editDocId">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ramal</label>
                    <input type="text" id="inputRamal" placeholder="Ex: 1000" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Setor</label>
                    <input type="text" id="inputSetor" placeholder="Ex: Portaria" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail (Opcional)</label>
                    <input type="email" id="inputEmail" placeholder="setor@empresa.com" class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button onclick="fecharModal()" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition">Cancelar</button>
                <button onclick="salvarRamal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Salvar</button>
            </div>
        </div>
    </div>

    <!-- LÓGICA E JAVASCRIPT (Sintaxe de Módulos Firebase CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            onSnapshot, 
            doc, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            writeBatch 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuração do Firebase
        const firebaseConfig = {
             apiKey: "AIzaSyCFMcGjsWQPKGGudgqU9M7MBf-W8n7UZ7s",
             authDomain: "ramais-32f11.firebaseapp.com",
             projectId: "ramais-32f11",
             storageBucket: "ramais-32f11.firebasestorage.app",
             messagingSenderId: "472510625245",
             appId: "1:472510625245:web:97fb0ac96df913ad4d7234",
             measurementId: "G-0NQVWMSRL7"
        };

        // Inicialização do Firebase e Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ramaisRef = collection(db, "ramais");

        const usuarios = {
            'admin': { senha: 'hsj*846', tipo: 'admin', nome: 'Administrador' },
            'viewer': { senha: '12345', tipo: 'viewer', nome: 'Visualizador' }
        };

        let sessaoAtual = sessionStorage.getItem('sessao_usuario');
        let listaRamaisGlobal = [];
        let estaPovoando = false;

        const dadosIniciais = [
            { ramal: "1042", setor: "1º Andar", email: "" }, { ramal: "1061", setor: "Ala A", email: "" },
            { ramal: "1045", setor: "Ala B", email: "" }, { ramal: "1011", setor: "Almoxarifado Central", email: "" },
            { ramal: "1005", setor: "UTI Ir. Dulce coordenação", email: "" }, { ramal: "1006", setor: "UTI Ir. Dulce Posto 02", email: "" },
            { ramal: "1009", setor: "UTI Ir. Dulce Posto 01", email: "" }, { ramal: "1007", setor: "UTI Ir. Dulce Farmácia", email: "" },
            { ramal: "1052", setor: "Arquivo (ao Id manu.)", email: "" }, { ramal: "1022", setor: "Auditoria", email: "" },
            { ramal: "1049", setor: "Balcão SADT", email: "" }, { ramal: "1047", setor: "Casa das Irmãs", email: "" },
            { ramal: "1048", setor: "Casa das Irmãs", email: "" }, { ramal: "1013", setor: "CCIH", email: "" },
            { ramal: "1026", setor: "Centro Cirúrgico", email: "" }, { ramal: "1027", setor: "Centro Cirúrgico", email: "" },
            { ramal: "1010", setor: "Consultório (urologia)", email: "" }, { ramal: "1012", setor: "Consultório (urologia)", email: "" },
            { ramal: "1015", setor: "Consultório (urologia)", email: "" }, { ramal: "1016", setor: "Consultório (urologia)", email: "" },
            { ramal: "1020", setor: "Contabilidade", email: "" }, { ramal: "1053", setor: "Copa 1º Andar", email: "" },
            { ramal: "1056", setor: "Cozinha", email: "" }, { ramal: "1018", setor: "CPD", email: "" },
            { ramal: "1058", setor: "Dept Enfermagem", email: "" }, { ramal: "1030", setor: "Diretoria - Presidência", email: "" },
            { ramal: "1040", setor: "Diretoria Secretária", email: "" }, { ramal: "1029", setor: "UTI Geral", email: "" },
            { ramal: "1019", setor: "Tomografia", email: "" }, { ramal: "1046", setor: "ECG", email: "" },
            { ramal: "1017", setor: "Endoscopia", email: "" }, { ramal: "1035", setor: "Farmácia", email: "" },
            { ramal: "1041", setor: "Faturamento", email: "" }, { ramal: "1066", setor: "Fissurados", email: "" },
            { ramal: "1033", setor: "Internamento", email: "" }, { ramal: "1023", setor: "Jurídico", email: "" },
            { ramal: "1025", setor: "Laboratório", email: "" }, { ramal: "1038", setor: "Laboratório (recepção)", email: "" },
            { ramal: "1031", setor: "Lavanderia", email: "" }, { ramal: "1051", setor: "Manutenção", email: "" },
            { ramal: "1039", setor: "Medicina do Trabalho", email: "" }, { ramal: "1057", setor: "Ortopedia", email: "" },
            { ramal: "1059", setor: "Otocenter", email: "" }, { ramal: "1055", setor: "Portaria", email: "" },
            { ramal: "1060", setor: "Rx Sala Técnico", email: "" }, { ramal: "1054", setor: "Sala de Produção", email: "" },
            { ramal: "1034", setor: "Setor de Compras", email: "" }, { ramal: "1021", setor: "Setor Pessoal", email: "" },
            { ramal: "1044", setor: "SHRAD posto", email: "" }, { ramal: "1043", setor: "Serviço Social", email: "" },
            { ramal: "1000 ou 9", setor: "Telefonista", email: "" }, { ramal: "1024", setor: "Tesouraria", email: "" },
            { ramal: "1008", setor: "Ultrasson / Urologia", email: "" }, { ramal: "1064", setor: "Urg. Mental Coordenação", email: "" },
            { ramal: "1037", setor: "Urg. Mental Recepção", email: "" }, { ramal: "1072", setor: "Urgência posto", email: "" },
            { ramal: "1028", setor: "Urgência", email: "" }, { ramal: "1068", setor: "Urologia Recepção", email: "" }
        ];

        function escutarFirebase() {
            onSnapshot(ramaisRef, (snapshot) => {
                if (snapshot.empty && !estaPovoando) {
                    povoarDadosIniciais();
                    return;
                }

                listaRamaisGlobal = [];
                snapshot.forEach((docSnap) => {
                    listaRamaisGlobal.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });
                });

                listaRamaisGlobal.sort((a, b) => (a.setor || '').localeCompare(b.setor || ''));
                filtrarRamais();
            }, (erro) => {
                console.error("Erro no Firestore: ", erro);
                const tbody = document.getElementById('tabelaRamais');
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-red-600 font-semibold">Erro de permissão no Firebase. Verifique as Regras de Segurança no Firestore Console.</td></tr>`;
            });
        }

        async function povoarDadosIniciais() {
            estaPovoando = true;
            try {
                const batch = writeBatch(db);
                dadosIniciais.forEach((item) => {
                    const newDocRef = doc(ramaisRef);
                    batch.set(newDocRef, item);
                });
                await batch.commit();
            } catch (err) {
                console.error("Erro ao povoar dados iniciais:", err);
            } finally {
                estaPovoando = false;
            }
        }

        function fazerLogin() {
            const usuarioSel = document.getElementById('loginUsuario').value;
            const senhaDigitada = document.getElementById('loginSenha').value;
            const erroEl = document.getElementById('erroLogin');

            if (usuarios[usuarioSel] && usuarios[usuarioSel].senha === senhaDigitada) {
                sessionStorage.setItem('sessao_usuario', usuarioSel);
                erroEl.classList.add('hidden');
                document.getElementById('loginSenha').value = '';
                liberarSistema(usuarios[usuarioSel]);
            } else {
                erroEl.classList.remove('hidden');
            }
        }

        function fazerLogout() {
            sessionStorage.removeItem('sessao_usuario');
            document.getElementById('sistemaPrincipal').classList.add('hidden');
            document.getElementById('telaLogin').classList.remove('hidden');
        }

        function liberarSistema(userObj) {
            document.getElementById('telaLogin').classList.add('hidden');
            document.getElementById('sistemaPrincipal').classList.remove('hidden');
            
            const label = document.getElementById('labelPerfil');
            const btnNovo = document.getElementById('btnNovoRamal');
            const colunaAcoes = document.getElementById('colunaAcoesHeader');

            label.innerText = userObj.nome;

            if (userObj.tipo === 'admin') {
                btnNovo.style.display = 'flex';
                colunaAcoes.style.display = 'table-cell';
                label.className = 'bg-blue-600 px-2.5 py-0.5 rounded-full text-xs font-bold text-white';
            } else {
                btnNovo.style.display = 'none';
                colunaAcoes.style.display = 'none';
                label.className = 'bg-emerald-600 px-2.5 py-0.5 rounded-full text-xs font-bold text-white';
            }

            escutarFirebase();
        }

        function renderizarTabela(dados) {
            const userObj = usuarios[sessionStorage.getItem('sessao_usuario')];
            const tbody = document.getElementById('tabelaRamais');
            tbody.innerHTML = '';

            if (dados.length === 0) {
                const colspan = userObj && userObj.tipo === 'admin' ? 4 : 3;
                tbody.innerHTML = `<tr><td colspan="${colspan}" class="text-center py-6 text-gray-500">Nenhum registo encontrado.</td></tr>`;
                return;
            }

            dados.forEach((item) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";
                
                let emailExibicao = item.email ? `<a href="mailto:${item.email}" class="text-blue-600 hover:underline">${item.email}</a>` : '<span class="text-gray-400 italic">Não informado</span>';

                let htmlConteudo = `
                    <td class="py-3 px-6 font-semibold text-blue-600">${item.ramal}</td>
                    <td class="py-3 px-6 text-gray-700">${item.setor}</td>
                    <td class="py-3 px-6 text-gray-600">${emailExibicao}</td>
                `;

                if (userObj && userObj.tipo === 'admin') {
                    htmlConteudo += `
                        <td class="py-3 px-6 text-center flex justify-center gap-2">
                            <button onclick="abrirModalEditar('${item.id}')" class="p-1.5 bg-yellow-50 text-yellow-600 hover:bg-yellow-100 rounded-lg transition" title="Editar">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                                </svg>
                            </button>
                            <button onclick="deletarRamal('${item.id}', '${item.ramal}')" class="p-1.5 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg transition" title="Excluir">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </td>
                    `;
                }

                tr.innerHTML = htmlConteudo;
                tbody.appendChild(tr);
            });
        }

        function filtrarRamais() {
            const termo = document.getElementById('searchInput').value.toLowerCase();
            const filtrados = listaRamaisGlobal.filter(item => 
                (item.ramal && item.ramal.toLowerCase().includes(termo)) || 
                (item.setor && item.setor.toLowerCase().includes(termo)) ||
                (item.email && item.email.toLowerCase().includes(termo))
            );
            renderizarTabela(filtrados);
        }

        function abrirModalAdicionar() {
            document.getElementById('modalTitulo').innerText = 'Adicionar Novo Ramal';
            document.getElementById('editDocId').value = '';
            document.getElementById('inputRamal').value = '';
            document.getElementById('inputSetor').value = '';
            document.getElementById('inputEmail').value = '';
            document.getElementById('modalRamal').classList.remove('hidden');
        }

        function abrirModalEditar(docId) {
            const item = listaRamaisGlobal.find(r => r.id === docId);
            if (!item) return;

            document.getElementById('modalTitulo').innerText = 'Editar Ramal';
            document.getElementById('editDocId').value = docId;
            document.getElementById('inputRamal').value = item.ramal || '';
            document.getElementById('inputSetor').value = item.setor || '';
            document.getElementById('inputEmail').value = item.email || '';
            document.getElementById('modalRamal').classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modalRamal').classList.add('hidden');
        }

        async function salvarRamal() {
            const ramalVal = document.getElementById('inputRamal').value.trim();
            const setorVal = document.getElementById('inputSetor').value.trim();
            const emailVal = document.getElementById('inputEmail').value.trim();
            const docId = document.getElementById('editDocId').value;

            if (!ramalVal || !setorVal) {
                alert('Por favor, preencha pelo menos o Ramal e o Setor.');
                return;
            }

            const dados = { ramal: ramalVal, setor: setorVal, email: emailVal };

            try {
                if (!docId) {
                    await addDoc(ramaisRef, dados);
                } else {
                    await updateDoc(doc(db, "ramais", docId), dados);
                }
                fecharModal();
            } catch (error) {
                alert('Erro ao salvar no Firebase: ' + error.message);
            }
        }

        async function deletarRamal(docId, numeroRamal) {
            if (confirm(`Deseja realmente excluir o ramal ${numeroRamal}?`)) {
                try {
                    await deleteDoc(doc(db, "ramais", docId));
                } catch (error) {
                    alert('Erro ao excluir do Firebase: ' + error.message);
                }
            }
        }

        // Exportação explícita para o escopo global (Window)
        window.fazerLogin = fazerLogin;
        window.fazerLogout = fazerLogout;
        window.filtrarRamais = filtrarRamais;
        window.abrirModalAdicionar = abrirModalAdicionar;
        window.abrirModalEditar = abrirModalEditar;
        window.fecharModal = fecharModal;
        window.salvarRamal = salvarRamal;
        window.deletarRamal = deletarRamal;

        // Auto-login se existir sessão ativa
        if (sessaoAtual && usuarios[sessaoAtual]) {
            liberarSistema(usuarios[sessaoAtual]);
        }
    </script>
</body>
</html>
